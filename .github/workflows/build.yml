name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies & Build Web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Compile Standalone Binaries (Linux & Windows)
        run: |
          mkdir -p release-binaries
          
          # Linux amd64
          echo "Building for Linux (amd64)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o release-binaries/config-studio-linux-amd64 ./cmd/server
          cp release-binaries/config-studio-linux-amd64 release-binaries/config-editor-linux-amd64
          
          # Linux arm64
          echo "Building for Linux (arm64)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o release-binaries/config-studio-linux-arm64 ./cmd/server
          cp release-binaries/config-studio-linux-arm64 release-binaries/config-editor-linux-arm64
          
          # Windows amd64 (.exe)
          echo "Building for Windows (amd64)..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o release-binaries/config-studio-windows-amd64.exe ./cmd/server
          cp release-binaries/config-studio-windows-amd64.exe release-binaries/config-editor-windows-amd64.exe

      - name: Generate Checksums (SHA-256)
        working-directory: release-binaries
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: config-studio-binaries
          path: release-binaries/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-binaries/*
          generate_release_notes: true
